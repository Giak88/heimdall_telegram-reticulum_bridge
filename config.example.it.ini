# Configurazione di Heimdall. setup.sh crea ~/.heimdall/config.ini da questo file e la compila.
# Dopo ogni modifica: ./setup.sh restart

[bridge]
# Lingua delle risposte del bot e dei log: en | it
language = it
# Nome che il bridge annuncia su Reticulum (lo mostrano Sideband / MeshChatX)
# name = Heimdall
announce_min = 15
# Messaggio LXMF più grande che il bridge accetta (foto/file da pubblicare su Telegram). LXMF di serie: 1 MB.
max_receive_mb = 10
# Cartella dati (identità, stato, spool)
dir = ~/.heimdall
# Cartella di configurazione di Reticulum: vuoto = ~/.reticulum, la stessa di rnsd
# rns_config = ~/.reticulum
# Facoltativo: propagation node per la consegna differita se quella diretta fallisce
# propagation_node = <hash>

[telegram]
# Token del bot da @BotFather. Tienilo segreto.
token =
# Id del gruppo o canale (numero negativo). ./setup.sh lo trova per te.
chat_id =

[lxmf]
# Indirizzi LXMF che ricevono tutto quello che si scrive nel gruppo Telegram (separati da virgola, 32 hex)
targets =
# Chi può pubblicare su Telegram scrivendo al bridge: anyone (chiunque) | targets (solo i destinatari)
senders = anyone
# yes: qualunque utente LXMF può mandare /entra per ricevere anche lui il gruppo (e /esci per smettere)
subscriptions = no
# yes: quello che pubblica un utente LXMF viene ripetuto anche agli altri destinatari LXMF
echo = no
# Indirizzi sempre ignorati
blocked =

[limits]
# Sopra questa dimensione (dopo la compressione) i destinatari ricevono un avviso e serve /scarica N
confirm_threshold_kb = 32
# Sopra questa dimensione il media non si può consegnare via LXMF (i router di serie rifiutano > 1000 KB): tienilo sotto 1
max_file_mb = 0.9
# Qualità di foto e vocali che arrivano da Telegram: low | medium | high | original
quality_img = low
quality_audio = low
# Modo Codec2 del livello 'low' dei vocali: 700C 1200 1300 1400 1600 2400 3200
codec2_mode = 2400
# Throughput reale del tuo link LoRa, usato solo per il tempo stimato negli avvisi
link_kbps = 1.2
# Ore dopo cui i media trattenuti vengono scartati
pending_ttl_h = 24
# Messaggi massimi al minuto per mittente LXMF (0 = nessun limite)
rate_per_min = 10

[names]
# Facoltativo: nomi fissi per indirizzi LXMF, usati al posto del nome annunciato:
# 0123456789abcdef0123456789abcdef = Mario IZ0ABC
