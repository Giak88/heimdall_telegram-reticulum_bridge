# Heimdall configuration. setup.sh creates ~/.heimdall/config.ini from this file and fills it in.
# After editing: ./setup.sh restart

[bridge]
# Language of the bot replies and of the logs: en | it
language = en
# Name the bridge announces on Reticulum (shown by Sideband / MeshChatX)
# name = Heimdall
announce_min = 15
# Biggest LXMF message the bridge accepts (photos/files to post on Telegram). Stock LXMF: 1 MB.
max_receive_mb = 10
# Data folder (identity, state, spool)
dir = ~/.heimdall
# Reticulum config folder: empty = ~/.reticulum, the same one rnsd uses
# rns_config = ~/.reticulum
# Optional: propagation node for deferred delivery if the direct one fails
# propagation_node = <hash>

[telegram]
# Bot token from @BotFather. Keep it secret.
token =
# Id of the group or channel (negative number). ./setup.sh finds it for you.
chat_id =

[lxmf]
# LXMF addresses that receive everything written in the Telegram group (comma-separated, 32 hex each)
targets =
# Who may post to Telegram by writing to the bridge: anyone | targets
senders = anyone
# yes: any LXMF user can send /join to receive the group too (and /leave to stop)
subscriptions = no
# yes: what one LXMF user posts is also repeated to the other LXMF recipients
echo = no
# Addresses that are always ignored
blocked =

[limits]
# Above this size (after compression) recipients get a notice and must send /download N
confirm_threshold_kb = 32
# Above this size a media file cannot be delivered over LXMF (stock routers refuse > 1000 KB): keep below 1
max_file_mb = 0.9
# Quality of the photos and voice notes coming from Telegram: low | medium | high | original
quality_img = low
quality_audio = low
# Codec2 mode of the 'low' voice level: 700C 1200 1300 1400 1600 2400 3200
codec2_mode = 2400
# Real throughput of your LoRa link, only used for the time estimate in notices
link_kbps = 1.2
# Hours after which held media are discarded
pending_ttl_h = 24
# Max messages per LXMF sender per minute (0 = no limit)
rate_per_min = 10
# Hours the messages the bridge sends you stay available for /repeat N, and how many at most (0 = no history)
history_h = 48
history_max = 100

[names]
# Optional fixed names for LXMF addresses, used instead of the announced name:
# 0123456789abcdef0123456789abcdef = Mario IZ0ABC
